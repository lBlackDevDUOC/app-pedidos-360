# Servidor de streaming Pedidos360 (EC2-3, t3.large).
# Lo despliega GitHub Actions (.github/workflows/deploy.yml): copia esta carpeta y ejecuta
#   docker compose up -d
# Las variables (.env) las escribe el pipeline desde los secrets del repositorio. En local no hace falta .env:
# todo tiene valor por defecto y los brokers se anuncian como "localhost".
#
# Arquitectura Kafka:
#   - Ensemble Zookeeper de 3 nodos: guarda los metadatos del clúster (brokers vivos, líderes de cada partición,
#     configuración de tópicos). Con 3 nodos el quórum es 2: sigue funcionando si cae 1.
#   - 3 brokers Kafka: cada partición tiene 3 réplicas, una en cada broker. Con min.insync.replicas=2 y acks=all
#     un mensaje confirmado ya está escrito en al menos 2 brokers: se puede perder 1 broker sin perder datos.
#   - kafka-init: crea los tópicos con sus particiones, réplicas y políticas (crear-topicos.sh). Corre y termina.
#   - Kafka-UI: consola web para ver brokers, tópicos, particiones, mensajes, consumer groups, offsets y lag.
#
# Red: Zookeeper NO publica puertos (solo existe dentro de la red de Docker). Los brokers publican 9092/9093/9094,
# que el Security Group abre solo al Security Group de la EC2-1 (el productor). Kafka-UI publica 8090 (solo tu IP).

x-zookeeper: &zookeeper
  image: confluentinc/cp-zookeeper:7.9.10
  restart: unless-stopped
  mem_limit: 384m
  environment: &zookeeper-env
    ZOOKEEPER_CLIENT_PORT: 2181
    ZOOKEEPER_TICK_TIME: 2000          # unidad de tiempo base (ms) para heartbeats y timeouts
    ZOOKEEPER_INIT_LIMIT: 5            # ticks que tiene un follower para conectarse y sincronizar con el líder
    ZOOKEEPER_SYNC_LIMIT: 2            # ticks que un follower puede quedar desfasado antes de ser descartado
    # Los 3 miembros del ensemble: puerto 2888 = réplica de datos, 3888 = elección de líder
    ZOOKEEPER_SERVERS: zookeeper-1:2888:3888;zookeeper-2:2888:3888;zookeeper-3:2888:3888
    KAFKA_HEAP_OPTS: -Xms128m -Xmx256m
    KAFKA_OPTS: -Dzookeeper.4lw.commands.whitelist=ruok,srvr,mntr
  healthcheck:
    # "ruok" (are you ok?) → el nodo responde "imok" si está sirviendo
    test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/2181 && printf ruok >&3 && grep -q imok <&3'"]
    interval: 10s
    timeout: 5s
    retries: 12

x-kafka: &kafka
  image: confluentinc/cp-kafka:7.9.10
  restart: unless-stopped
  mem_limit: 1g
  depends_on:
    zookeeper-1:
      condition: service_healthy
    zookeeper-2:
      condition: service_healthy
    zookeeper-3:
      condition: service_healthy
  environment: &kafka-env
    KAFKA_ZOOKEEPER_CONNECT: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
    # Dos listeners: INTERNAL para el tráfico entre brokers y contenedores de esta máquina (red Docker),
    # EXTERNAL para los microservicios de otras EC2 (se anuncia la IP privada de esta instancia)
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
    KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
    # Durabilidad: 3 copias de todo, y una escritura con acks=all necesita 2 réplicas sincronizadas
    KAFKA_DEFAULT_REPLICATION_FACTOR: 3
    KAFKA_MIN_INSYNC_REPLICAS: 2
    KAFKA_NUM_PARTITIONS: 3
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3          # __consumer_offsets: dónde va cada consumer group
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
    # Nunca elegir como líder una réplica desactualizada (evita perder mensajes confirmados)
    KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
    # Los tópicos se crean solo de forma controlada (kafka-init o ms-kafka-admin), nunca por un typo en el código
    KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    KAFKA_LOG_RETENTION_HOURS: 168                     # retención por defecto 7 días (cada tópico la ajusta)
    KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 3000       # espera a que se unan todos los consumidores antes de repartir
    KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    KAFKA_JMX_PORT: 9997                               # métricas JMX que lee Kafka-UI
  healthcheck:
    test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 > /dev/null 2>&1"]
    interval: 15s
    timeout: 15s
    retries: 12
    start_period: 30s

services:
  # ---------------------------------------------------------------- Ensemble Zookeeper (3 nodos)
  zookeeper-1:
    <<: *zookeeper
    container_name: pedidos360-zookeeper-1
    hostname: zookeeper-1
    environment:
      <<: *zookeeper-env
      ZOOKEEPER_SERVER_ID: 1
    volumes:
      - zk1_data:/var/lib/zookeeper/data
      - zk1_log:/var/lib/zookeeper/log

  zookeeper-2:
    <<: *zookeeper
    container_name: pedidos360-zookeeper-2
    hostname: zookeeper-2
    environment:
      <<: *zookeeper-env
      ZOOKEEPER_SERVER_ID: 2
    volumes:
      - zk2_data:/var/lib/zookeeper/data
      - zk2_log:/var/lib/zookeeper/log

  zookeeper-3:
    <<: *zookeeper
    container_name: pedidos360-zookeeper-3
    hostname: zookeeper-3
    environment:
      <<: *zookeeper-env
      ZOOKEEPER_SERVER_ID: 3
    volumes:
      - zk3_data:/var/lib/zookeeper/data
      - zk3_log:/var/lib/zookeeper/log

  # ---------------------------------------------------------------- Brokers Kafka (3)
  kafka-1:
    <<: *kafka
    container_name: pedidos360-kafka-1
    hostname: kafka-1
    ports:
      - "9092:9092"
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:29092,EXTERNAL://${KAFKA_ADVERTISED_HOST:-localhost}:9092
      KAFKA_JMX_HOSTNAME: kafka-1
    volumes:
      - kafka1_data:/var/lib/kafka/data

  kafka-2:
    <<: *kafka
    container_name: pedidos360-kafka-2
    hostname: kafka-2
    ports:
      - "9093:9093"
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 2
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:29092,EXTERNAL://${KAFKA_ADVERTISED_HOST:-localhost}:9093
      KAFKA_JMX_HOSTNAME: kafka-2
    volumes:
      - kafka2_data:/var/lib/kafka/data

  kafka-3:
    <<: *kafka
    container_name: pedidos360-kafka-3
    hostname: kafka-3
    ports:
      - "9094:9094"
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 3
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:29092,EXTERNAL://${KAFKA_ADVERTISED_HOST:-localhost}:9094
      KAFKA_JMX_HOSTNAME: kafka-3
    volumes:
      - kafka3_data:/var/lib/kafka/data

  # ---------------------------------------------------------------- Creación de tópicos (una vez)
  # Perfil "init": no arranca con "up -d", se ejecuta a pedido y devuelve su código de salida:
  #   docker compose run --rm kafka-init
  # En local, todo de una vez: docker compose --profile init up -d
  kafka-init:
    image: confluentinc/cp-kafka:7.9.10
    profiles: ["init"]
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    environment:
      BOOTSTRAP: kafka-1:29092,kafka-2:29092,kafka-3:29092
    volumes:
      - ./crear-topicos.sh:/crear-topicos.sh:ro
    entrypoint: ["bash", "/crear-topicos.sh"]
    restart: "no"

  # ---------------------------------------------------------------- Kafka-UI
  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    container_name: pedidos360-kafka-ui
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      kafka-1:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: pedidos360
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      KAFKA_CLUSTERS_0_METRICS_TYPE: JMX
      KAFKA_CLUSTERS_0_METRICS_PORT: 9997
      DYNAMIC_CONFIG_ENABLED: "false"
      # Login propio aunque el puerto ya esté limitado a tu IP (defensa en profundidad)
      AUTH_TYPE: LOGIN_FORM
      SPRING_SECURITY_USER_NAME: ${KAFKA_UI_USER:-admin}
      SPRING_SECURITY_USER_PASSWORD: ${KAFKA_UI_PASSWORD:-admin}
      JAVA_OPTS: -Xms128m -Xmx384m

volumes:
  zk1_data:
  zk1_log:
  zk2_data:
  zk2_log:
  zk3_data:
  zk3_log:
  kafka1_data:
  kafka2_data:
  kafka3_data:

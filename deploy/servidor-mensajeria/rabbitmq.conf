# Configuración común de los 2 nodos del clúster RabbitMQ de Pedidos360 (EC2-2, t3.small).

# ---------------------------------------------------------------- Clúster
# Formación automática: cada nodo conoce la lista de miembros y se une al arrancar.
# Los nodos se reconocen porque comparten la misma Erlang cookie (RABBITMQ_ERLANG_COOKIE).
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@pedidos360-rabbitmq-1
cluster_formation.classic_config.nodes.2 = rabbit@pedidos360-rabbitmq-2

# Cada cola nueva se crea en el nodo con menos colas: la carga se reparte entre los dos nodos
queue_leader_locator = balanced

# ---------------------------------------------------------------- Protección de recursos
# Si un nodo supera este uso de memoria activa la "memory alarm": bloquea temporalmente a los
# productores hasta que los consumidores vacíen las colas. Así el broker nunca tumba la máquina.
vm_memory_high_watermark.absolute = 256MiB
# Si queda menos de 1 GB libre en disco también bloquea a los productores (protege los mensajes persistentes)
disk_free_limit.absolute = 1GB

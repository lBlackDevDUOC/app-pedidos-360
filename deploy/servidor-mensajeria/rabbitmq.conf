# Ajustes de RabbitMQ para una t3.micro (1 GB de RAM compartida con 3 microservicios).
# Si RabbitMQ supera este uso de memoria activa la "memory alarm": bloquea temporalmente a los
# productores hasta que los consumidores vacíen las colas. Así el broker nunca tumba la máquina.
vm_memory_high_watermark.absolute = 256MiB
# Si queda menos de 1 GB libre en disco también bloquea a los productores (protege los mensajes persistentes)
disk_free_limit.absolute = 1GB

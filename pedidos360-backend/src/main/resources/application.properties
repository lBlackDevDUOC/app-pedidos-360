server.port=8080

# Emisor de los tokens: Microsoft Entra ID (tenant). Spring descarga las claves
# públicas (JWKS) desde este issuer para validar la firma de los JWT.
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/bb5324af-c266-41ed-b36c-a971641c7af2/v2.0

# Audience (claim "aud"): Client ID de la app registrada en Entra ID.
spring.security.oauth2.resourceserver.jwt.audiences=d4b53b0b-a9b3-42b4-b63d-71d24f58813b

# Origen permitido por CORS (frontend Angular)
pedidos360.cors.allowed-origins=http://localhost:4200,http://54.242.195.23
# Configuración de Base de Datos PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/pedidos360_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de Hibernate / JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
